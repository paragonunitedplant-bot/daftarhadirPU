<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi RFID - PT Paragon</title>
    <!-- Tailwind CSS untuk Desain Rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8 text-center border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Absensi RFID Paragon</h1>
        <p class="text-sm text-slate-500 mb-6">Silakan tap kartu RFID Anda pada alat pembaca</p>

        <!-- Kotak Input / Focus untuk Pembaca RFID -->
        <div class="mb-6">
            <input type="password" id="rfidInput" autofocus placeholder="Tap kartu di sini..." 
                class="w-full px-4 py-3 text-center text-lg bg-slate-50 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-indigo-600 transition">
        </div>

        <!-- Status Hasil Absen -->
        <div id="statusBox" class="hidden p-4 rounded-xl text-sm font-medium transition"></div>
    </div>

    <script>
        const rfidInput = document.getElementById('rfidInput');
        const statusBox = document.getElementById('statusBox');

        // Agar input selalu fokus meskipun diklik sembarang tempat
        document.addEventListener('click', () => rfidInput.focus());

        rfidInput.addEventListener('keypress', async function (e) {
            if (e.key === 'Enter') {
                const uid = rfidInput.value.trim();
                rfidInput.value = ''; // Kosongkan kembali untuk tap berikutnya

                if (!uid) return;

                // Tampilkan status "Memproses..."
                statusBox.className = "p-4 rounded-xl text-sm font-medium bg-blue-50 text-blue-700 border border-blue-200 block";
                statusBox.innerText = "Memproses absensi...";

                try {
                    const response = await fetch('/api/absen', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ uid: uid })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        statusBox.className = "p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 block";
                        statusBox.innerHTML = `✅ <b>Berhasil!</b><br>Halo, ${result.nama}<br>Jam: ${result.waktu}`;
                    } else {
                        statusBox.className = "p-4 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200 border-rose-200 block";
                        statusBox.innerText = `❌ Gagal: ${result.message || 'Kartu tidak dikenali'}`;
                    }
                } catch (err) {
                    statusBox.className = "p-4 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200 block";
                    statusBox.innerText = "❌ Kesalahan koneksi ke server.";
                }

                // Sembunyikan status otomatis setelah 4 detik
                setTimeout(() => {
                    statusBox.className = "hidden";
                }, 4000);
            }
        });
    </script>
</body>
</html>
