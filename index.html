<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi RFID</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      background-color: #e4e6e9;
      background-image: url("./bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero-display {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 36px;
      padding: 0 12px;
    }

    .nama {
      font-size: clamp(56px, 10.5vw, 128px);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.02;
      color: #0b0f19;
      margin: 0;
      word-break: break-word;
    }

    .tim {
      font-size: clamp(24px, 4.4vw, 50px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1.15;
      color: #111827;
      margin-top: 12px;
    }

    .placeholder-title {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      color: #334155;
      margin: 0;
    }

    .placeholder-sub {
      font-size: 15px;
      color: #64748b;
      margin-top: 8px;
    }

    .status-error {
      font-size: clamp(28px, 4.5vw, 44px);
      font-weight: 800;
      color: #b91c1c;
      margin: 0;
    }

    .tap-panel {
      width: 100%;
      max-width: 390px;
      background: rgba(203, 213, 225, 0.56);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      padding: 20px 24px 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .tap-heading {
      font-size: 19px;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
    }

    .tap-instruction {
      font-size: 13px;
      color: #1e293b;
      margin-top: 4px;
      margin-bottom: 14px;
    }

    .rfid-input {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 999px;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      text-align: center;
      padding: 0 18px;
      outline: none;
      box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    .rfid-input::placeholder {
      color: #334155;
    }

    .rfid-input:focus {
      box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.25);
    }

    .info-kecil {
      margin-top: 10px;
      font-size: 12px;
      color: #475569;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="hero-display" id="hasilBox">
      <div class="placeholder-title">Siap Absen</div>
      <div class="placeholder-sub">Tempelkan kartu RFID untuk menampilkan nama dan tim</div>
    </section>

    <section class="tap-panel">
      <h1 class="tap-heading">Tap Kartu RFID</h1>
      <p class="tap-instruction">Pastikan kursor aktif di kolom bawah ini</p>

      <input
        id="rfidInput"
        class="rfid-input"
        type="text"
        placeholder="Menunggu tap kartu ....."
        autofocus
        autocomplete="off"
      />

      <div class="info-kecil" id="infoStatus"></div>
    </section>
  </main>

  <script>
    const inputEl = document.getElementById("rfidInput");
    const hasilBox = document.getElementById("hasilBox");
    const infoStatus = document.getElementById("infoStatus");

    document.addEventListener("click", () => {
      inputEl.focus();
    });

    inputEl.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const uid = inputEl.value.trim();
        inputEl.value = "";
        if (!uid) return;

        infoStatus.textContent = `Memproses UID: ${uid}...`;

        try {
          const res = await fetch(`/api/absen?uid=${encodeURIComponent(uid)}`);
          const data = await res.json();

          if (!res.ok) {
            hasilBox.innerHTML = `
              <div class="status-error">Gagal Terhubung</div>
              <div class="placeholder-sub">${escapeHtml(data.message || "Terjadi kesalahan pada server")}</div>
            `;
            infoStatus.textContent = "";
            return;
          }

          if (data.status === "success") {
            hasilBox.innerHTML = `
              <div class="nama">${escapeHtml(data.nama)}</div>
              <div class="tim">${escapeHtml(data.tim)}</div>
            `;
            infoStatus.textContent = `Tercatat • UID: ${data.uid} • ${escapeHtml(data.waktu || "")}`;
          } else {
            hasilBox.innerHTML = `
              <div class="status-error">Kartu Tidak Terdaftar</div>
              <div class="placeholder-sub">UID: ${escapeHtml(data.uid)} ${data.waktu ? "• " + escapeHtml(data.waktu) : ""}</div>
            `;
            infoStatus.textContent = "Daftarkan UID ke sheet Master_Data";
          }
        } catch (err) {
          hasilBox.innerHTML = `
            <div class="status-error">Gagal Terhubung</div>
            <div class="placeholder-sub">Periksa koneksi atau konfigurasi Vercel</div>
          `;
          infoStatus.textContent = "";
        } finally {
          inputEl.focus();
        }
      }
    });

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
