<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi RFID</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 36px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      background: #0f172a;
      color: #fff;
      text-align: center;
      box-sizing: border-box;
      margin-top: 12px;
    }
    .hasil {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      background: #0f172a;
      min-height: 125px;
    }
    .nama { font-size: 28px; font-weight: bold; color: #4ade80; }
    .nip { font-size: 16px; color: #cbd5e1; margin-top: 4px; font-weight: bold; }
    .tim { font-size: 20px; color: #38bdf8; margin-top: 6px; }
    .ditolak { color: #f87171; }
    .meta { font-size: 13px; color: #94a3b8; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Tap Kartu RFID</h2>
    <p class="meta">Pastikan kursor aktif di kolom di bawah ini</p>
    <input id="rfidInput" type="text" placeholder="Menunggu tap kartu..." autofocus autocomplete="off" />

    <div class="hasil" id="hasilBox">
      <div class="meta">Belum ada kartu yang di-tap</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMy9HreLgqE-1gTc2YnNkQlV6UGG06L8Dq_IbyN8AOE5OJcbSqn0GteUlIJkFdLtcoSA/exec";
    const inputEl = document.getElementById("rfidInput");
    const hasilBox = document.getElementById("hasilBox");

    document.addEventListener("click", () => inputEl.focus());

    inputEl.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        const uid = inputEl.value.trim();
        inputEl.value = "";
        if (!uid) return;

        hasilBox.innerHTML = `<div class="meta">Memproses UID: <b>${uid}</b>...</div>`;

        try {
          const res = await fetch(`${SCRIPT_URL}?uid=${encodeURIComponent(uid)}`);
          const data = await res.json();

          if (data.status === "success") {
            hasilBox.innerHTML = `
              <div class="nama">${data.nama}</div>
              <div class="nip">NIP: ${data.nip}</div>
              <div class="tim">Tim: ${data.tim}</div>
              <div class="meta">UID: ${data.uid} • ${data.waktu}</div>
            `;
          } else {
            hasilBox.innerHTML = `
              <div class="nama ditolak">Kartu Tidak Terdaftar</div>
              <div class="meta">UID: ${data.uid} • ${data.waktu || ""}</div>
            `;
          }
        } catch (err) {
          hasilBox.innerHTML = `<div class="nama ditolak">Gagal terhubung ke Spreadsheet</div>`;
        }
      }
    });
  </script>
</body>
</html>
